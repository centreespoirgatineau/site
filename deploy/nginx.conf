# The public site. Traefik terminates TLS and forwards plain HTTP here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Clean addresses: /dons serves dons.html, and an unknown one the 404 page.
    # nginx builds redirect targets from its own listen port (8080) unless told
    # otherwise, which leaked ":8080" into the Location header behind Traefik.
    absolute_redirect off;

    error_page 404 /404.html;
    # try_files serves the file it finds INSIDE this location, without
    # re-matching locations, so the headers must be declared right here: for a
    # while /benevolat and friends went out without them and browsers kept
    # stale copies for hours. Only the home page, resolved through `index`,
    # was getting them.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store";
        include /etc/nginx/conf.d/security.inc;
    }
    # Old Wix addresses that were shared around: keep them working.
    location = /aide { return 301 /aide-alimentaire; }
    location = /embauche { return 301 /benevolat; }

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # HTML is never cached (it names the hashed stylesheet); hashed assets are
    # cached for a year; fonts and images for a month.
    location ~* "\.html$" { add_header Cache-Control "no-store"; include /etc/nginx/conf.d/security.inc; }
    location ~* "\.[0-9a-f]{10}\.(css|js)$" { add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/conf.d/security.inc; }
    location ~* "\.(svg|png|jpg|webp|woff2|webmanifest|ico)$" { add_header Cache-Control "public, max-age=2592000"; include /etc/nginx/conf.d/security.inc; }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/xml text/plain application/manifest+json;

    # Security headers on every response (nginx drops the parent's add_header
    # inside a location that has its own, hence the include above).
    include /etc/nginx/conf.d/security.inc;
}
