<!doctype html>
<html lang="fr-CA" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical }}">
  <meta name="theme-color" content="#FAF9F5">
  <script>document.documentElement.className="js"</script>
  <link rel="icon" href="/favicon.svg?v={{ favicon_v }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v={{ touch_v }}">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Centre Espoir de Gatineau">
  <meta property="og:locale" content="fr_CA">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ og_alt }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ og_image }}">
  <meta name="twitter:image:alt" content="{{ og_alt }}">
  <link rel="preload" href="/assets/fonts/SourceSerif4-normal-400-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/SourceSans3-normal-400-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ css }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://centreespoir.ca/#site",
        "url": "https://centreespoir.ca",
        "name": "Centre Espoir de Gatineau",
        "inLanguage": "fr-CA",
        "publisher": { "@id": "https://centreespoir.ca/#org" }
      },
      {
        "@type": ["NGO", "LocalBusiness"],
        "@id": "https://centreespoir.ca/#org",
        "name": "Centre Espoir de Gatineau",
        "alternateName": "Centre Espoir",
        "legalName": "Centre Espoir de Gatineau",
        "description": "Banque alimentaire fondée en 1984 au service du quartier Notre-Dame et des secteurs environnants de Gatineau. Plus de 250 familles aidées chaque mois.",
        "slogan": "Nourrir le corps, ce n’est que la moitié du travail.",
        "url": "https://centreespoir.ca",
        "logo": "https://centreespoir.ca/assets/img/logo-vertical.svg",
        "image": "https://centreespoir.ca/og.png",
        "foundingDate": "1984",
        "taxID": "848106365RR0001",
        "telephone": "+1-819-663-3238",
        "email": "info@centreespoir.ca",
        "priceRange": "$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "791, boulevard Maloney Est",
          "addressLocality": "Gatineau",
          "addressRegion": "QC",
          "postalCode": "J8P 1H8",
          "addressCountry": "CA"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 45.4830815, "longitude": -75.614716 },
        "hasMap": "https://maps.google.com/?q=791+Boulevard+Maloney+E,+Gatineau,+QC+J8P+1H8",
        "areaServed": { "@type": "City", "name": "Gatineau", "sameAs": "https://www.wikidata.org/wiki/Q140884" },
        "openingHoursSpecification": [{
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Tuesday", "Wednesday", "Thursday"],
          "opens": "09:30",
          "closes": "12:30"
        }],
        "knowsLanguage": ["fr-CA", "en-CA"],
        "sameAs": [
          "https://www.facebook.com/centreespoirgatineau",
          "https://www.instagram.com/centreespoirgatineau"
        ]
      }
    ]
  }
  </script>
</head>
<body class="{{ body_class }}" data-page="{{ page }}">
  <a class="skip" href="#contenu">Aller au contenu</a>
{{> header }}
  <main id="contenu">
{{ content }}
  </main>
{{> footer }}
  <script src="{{ js }}" defer></script>
</body>
</html>
